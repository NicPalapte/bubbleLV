[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "bubble"
version = "0.1.0"
description = "Webbasierte Bid-Management-App für Bauunternehmen"
requires-python = ">=3.12"

dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # Datenbank
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",          # Async PostgreSQL-Treiber

    # Validierung & Settings
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # Auth
    "fastapi-users[sqlalchemy]>=13.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # E-Mail
    "fastapi-mail>=1.4.0",

    # GAEB-Parsing
    "pyGAEB>=0.4.0",

    # Logging
    "structlog>=24.0.0",

    # HTTP-Client (intern genutzt)
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",

    # Linting & Formatierung
    "ruff>=0.4.4",
    "mypy>=1.10.0",

    # mypy Stubs & Plugins
    "sqlalchemy[mypy]>=2.0.0",
    "types-passlib>=1.7.7",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

# FastAPI-Dekoratoren erzeugen false positives im strict-Modus
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["pygaeb.*", "fastapi_mail.*", "fastapi_users.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]