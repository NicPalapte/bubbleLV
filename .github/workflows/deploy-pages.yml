name: Deploy to GitHub Pages

# Was macht dieser Workflow?
# Baut die App und schreibt das fertige Bundle in den Branch `gh-pages`.
# GitHub Pages liefert diesen Branch aus:
#   https://<owner>.github.io/<repo>/
#
# Warum über einen Branch und nicht mehr über das Pages-Artefakt?
# Nur so können die PR-Previews (pr-preview.yml) im selben Pages-Auftritt unter
# `pr-preview/pr-<nummer>/` liegen. Siehe docs/decisions/0002-pr-preview.md.
#
# Dieser Workflow räumt auch die Previews auf: er übernimmt vor dem Veröffentlichen
# genau die Previews der offenen Pull Requests, alle übrigen fallen weg. Damit gibt
# es beim Merge nur noch einen einzigen Schreibvorgang auf `gh-pages`.
# Siehe docs/decisions/0007-previews-im-deploy-aufraeumen.md.

on:
  push:
    branches: [main]
  # Erlaubt, einen Feature-Branch manuell testweise zu deployen.
  workflow_dispatch:

permissions:
  contents: write
  # Zum Nachschlagen, welche Pull Requests noch offen sind.
  pull-requests: read

# Nur ein Deployment gleichzeitig; laufende nicht abbrechen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Abhängigkeiten installieren
        working-directory: frontend
        run: npm ci

      - name: Tests
        working-directory: frontend
        run: npm test

      # Project Pages liegen unter /<repo>/ – die Base kommt aus dem Repo-Namen,
      # damit ein Rename das Deployment nicht bricht. Lokal bleibt die Base "/".
      - name: App bauen
        working-directory: frontend
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      # Der Veröffentlichungsschritt spiegelt frontend/dist nach gh-pages und löscht
      # dort alles, was im Ordner fehlt. Damit die Previews noch offener Pull Requests
      # das überleben, werden sie vorher aus gh-pages in den Build-Ordner kopiert.
      # Previews geschlossener PRs fehlen dann – und verschwinden genau dadurch.
      #
      # Klappt das nicht, wird nicht aufgeräumt, statt das Live-Deployment zu verlieren.
      # Der Schritt meldet nur im Erfolgsfall "aufraeumen=ja"; jeder andere Ausgang —
      # abgefangener Fehler, unerwarteter Abbruch des Skripts, gar kein Output — lässt den
      # Wert auf etwas anderem stehen und schützt damit sämtliche Previews.
      # continue-on-error, damit auch ein Abbruch mit Exit-Code den Deploy nicht
      # überspringt: die Seite muss in jedem Fall online gehen.
      - name: Previews offener Pull Requests übernehmen
        id: previews
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          # Wird diese Zahl erreicht, ist die Liste womöglich abgeschnitten. Dann lieber
          # gar nicht aufräumen, als eine Preview still zu löschen.
          LIMIT: '200'
        run: |
          set -uo pipefail

          # Aufräumen für diesen Lauf abschalten und den Schritt trotzdem grün beenden.
          schutz() {
            echo "::warning::$1 – Previews werden diesmal nicht aufgeräumt."
            echo "aufraeumen=nein" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # Beim allerersten Lauf gibt es den Branch noch nicht.
          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "Branch gh-pages existiert noch nicht – nichts zu übernehmen."
            echo "aufraeumen=ja" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-recurse-submodules --depth=1 origin gh-pages \
            || schutz "Branch gh-pages nicht erreichbar"

          offene=$(gh pr list --state open --limit "$LIMIT" --json number --jq '.[].number') \
            || schutz "Liste der offenen Pull Requests nicht abrufbar"

          anzahl=$(printf '%s\n' "$offene" | grep -c . || true)
          if [ "$anzahl" -ge "$LIMIT" ]; then
            schutz "$anzahl offene Pull Requests, Limit $LIMIT erreicht"
          fi

          for nummer in $offene; do
            pfad="pr-preview/pr-$nummer"
            if git cat-file -e "FETCH_HEAD:$pfad" 2>/dev/null; then
              git archive FETCH_HEAD "$pfad" | tar -x -C frontend/dist \
                || schutz "Preview $pfad nicht lesbar"
              echo "übernommen: $pfad"
            else
              echo "keine Preview vorhanden: $pfad"
            fi
          done

          echo "$anzahl offene Pull Request(s) geprüft, Aufräumen aktiv."
          echo "aufraeumen=ja" >> "$GITHUB_OUTPUT"

      # frontend/public/.nojekyll wandert beim Bauen nach dist und damit in den
      # Branch. Ohne diese Datei schiebt GitHub Pages den Branch durch Jekyll;
      # Dateien mit führendem "_" fehlten dann wortlos auf der Live-Seite.
      - name: Nach gh-pages veröffentlichen
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/dist
          branch: gh-pages
          # Leer = aufräumen; pr-preview/ = alle Previews schützen. Die Bedingung steht
          # bewusst andersherum ("!= ja" statt "== ja"): In GitHub-Ausdrücken ist der
          # leere String falsy, deshalb liefert `bedingung && '' || 'pr-preview/'` immer
          # pr-preview/. Der nicht-leere Wert muss im true-Zweig stehen.
          # Alles außer einem sauberen "ja" führt so zum Schutz — auch ein Abbruch des
          # Skripts, der überhaupt keinen Wert hinterlässt.
          clean-exclude: ${{ steps.previews.outputs.aufraeumen != 'ja' && 'pr-preview/' || '' }}
          force: false
