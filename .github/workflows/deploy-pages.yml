name: Deploy to GitHub Pages

# Was macht dieser Workflow?
# Baut die App und schreibt das fertige Bundle in den Branch `gh-pages`.
# GitHub Pages liefert diesen Branch aus:
#   https://<owner>.github.io/<repo>/
#
# Warum über einen Branch und nicht mehr über das Pages-Artefakt?
# Nur so können die PR-Previews (pr-preview.yml) im selben Pages-Auftritt unter
# `pr-preview/pr-<nummer>/` liegen. Siehe docs/decisions/0002-pr-preview.md.

on:
  push:
    branches: [main]
  # Erlaubt, einen Feature-Branch manuell testweise zu deployen.
  workflow_dispatch:

permissions:
  contents: write

# Nur ein Deployment gleichzeitig; laufende nicht abbrechen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Abhängigkeiten installieren
        working-directory: frontend
        run: npm ci

      - name: Tests
        working-directory: frontend
        run: npm test

      # Project Pages liegen unter /<repo>/ – die Base kommt aus dem Repo-Namen,
      # damit ein Rename das Deployment nicht bricht. Lokal bleibt die Base "/".
      - name: App bauen
        working-directory: frontend
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      # clean-exclude schützt die PR-Previews: ohne das würde jedes main-Deployment
      # den Ordner pr-preview/ im gh-pages-Branch mitlöschen.
      - name: Nach gh-pages veröffentlichen
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/dist
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
