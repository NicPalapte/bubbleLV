name: PR-Preview

# Was macht dieser Workflow?
# Ein Pull Request bekommt auf Zuruf eine eigene, klickbare Version der App unter
#   https://<owner>.github.io/<repo>/pr-preview/pr-<nummer>/
# Der Link wird automatisch als Kommentar in den PR geschrieben.
#
# Aufgeräumt wird hier NICHT. Die Preview eines geschlossenen PRs entfernt der
# Deploy-Workflow beim nächsten Veröffentlichen von `main` – er übernimmt nur noch
# die Previews der offenen Pull Requests. Grund: Merge löste früher zwei Schreib-
# vorgänge auf `gh-pages` gleichzeitig aus (Aufräumen + Deploy), wodurch GitHub den
# Seiten-Build abbrach. Siehe docs/decisions/0007-previews-im-deploy-aufraeumen.md.
#
# Die Previews liegen im Branch `gh-pages` im Ordner `pr-preview/`; der Live-Stand von
# `main` liegt im Wurzelverzeichnis desselben Branches (siehe deploy-pages.yml).
#
# Gebaut wird nur auf Zuruf: Kommentar `/preview` im Pull Request. Nicht bei jedem Push –
# die meisten Zwischenstände braucht niemand zum Anklicken, und der Build dauert länger
# als der ganze Rest der CI. Nach neuen Pushes zeigt die Preview den alten Stand, bis
# jemand erneut `/preview` schreibt.
#
# Einrichtung: docs/setup/ci-und-agenten.md · Begründung: docs/decisions/0002-pr-preview.md
# und docs/decisions/0042-preview-auf-zuruf.md

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    # Nur Kommentare im Pull Request, die mit `/preview` beginnen, und nur von Personen
    # mit Rechten am Repo – der Build schreibt nach gh-pages.
    if: >-
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/preview') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
               github.event.comment.author_association)
    runs-on: ubuntu-latest
    # Pro PR nur eine Preview-Aktion gleichzeitig, sonst überschreiben sich Deployments.
    # Die Sperre steht am Job, nicht am Workflow: jeder Kommentar startet den Workflow,
    # auch der Link-Kommentar der Preview selbst. Am Workflow könnte so ein
    # übersprungener Lauf eine wartende Preview verdrängen.
    concurrency: preview-${{ github.event.issue.number }}
    env:
      PR: ${{ github.event.issue.number }}
    steps:
      # Sofortige Rückmeldung am Kommentar (👀), der Build dauert ein paar Minuten.
      - name: Kommentar bestätigen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=eyes > /dev/null || echo "Reaktion nicht möglich – Build läuft trotzdem."

      # Ein Kommentar-Ereignis kennt nur die PR-Nummer, nicht den Branch. Den holen wir
      # nach – und brechen bei Fork-PRs ab: die dürfen nicht nach gh-pages schreiben.
      - name: PR-Stand bestimmen
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          info=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR")
          head_repo=$(jq -r '.head.repo.full_name // ""' <<<"$info")
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "PR kommt aus einem Fork ($head_repo) – keine Preview."
            exit 1
          fi
          echo "sha=$(jq -r '.head.sha' <<<"$info")" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Abhängigkeiten installieren
        working-directory: frontend
        run: npm ci

      # Die Preview liegt in einem Unterordner, deshalb muss die Base-URL diesen Pfad
      # enthalten – sonst suchen JS/CSS im Wurzelverzeichnis und die Seite bleibt leer.
      - name: App bauen
        working-directory: frontend
        run: |
          npm run build -- \
            --base=/${{ github.event.repository.name }}/pr-preview/pr-${{ env.PR }}/

      # action: deploy statt des Standards "auto" – der Workflow soll unter keinen
      # Umständen aufräumen. pr-number und Commit-Text explizit, weil das
      # Kommentar-Ereignis keine PR-Nummer an der Stelle trägt, wo die Action sucht.
      - name: Preview veröffentlichen
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: frontend/dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: deploy
          pr-number: ${{ env.PR }}
          deploy-commit-message: Deploy preview for PR ${{ env.PR }}
          # Den Link-Kommentar schreibt der nächste Schritt: die Action findet beim
          # Kommentar-Ereignis keine PR-Nummer und lässt ihn sonst still weg.
          comment: false

      # Link als Kommentar in den PR. Gibt es schon einen von früher, wird er
      # aktualisiert statt einen zweiten anzulegen (Erkennung über die Marke, nur
      # eigene Kommentare – fremde darf der Workflow nicht ändern).
      - name: Link in den PR schreiben
        env:
          GH_TOKEN: ${{ github.token }}
          URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-preview/pr-${{ env.PR }}/
        run: |
          set -euo pipefail
          marke='<!-- pr-preview-link -->'
          stand=$(date -u '+%Y-%m-%d %H:%M')
          text=$(printf '%s\n🚀 **Preview:** %s\n\nStand %s UTC. Ist erst nach dem GitHub-Pages-Deployment erreichbar (1–2 Minuten).' \
            "$marke" "$URL" "$stand")
          alt=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marke\")))][0].id // empty")
          # --paginate liefert je Seite eine Zeile; die erste genügt.
          alt=${alt%%$'\n'*}
          if [ -n "$alt" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$alt" -f body="$text" > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$text" > /dev/null
          fi
