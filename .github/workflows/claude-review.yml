name: Claude PR Review

# Was macht dieser Workflow?
# Ein KI-Agent liest jeden Pull Request Zeile für Zeile und hängt gefundene Probleme
# als Kommentar direkt an die betroffene Codestelle.
#
# Damit das nicht endlos läuft und keine unnötigen Kosten entstehen:
# - höchstens 3 automatische Reviews pro Pull Request (Zähler steht als Kommentar im PR)
# - danach nur noch auf Zuruf: Kommentar mit "@claude review" schreiben
# - Entwürfe (Draft-PRs) werden nicht automatisch geprüft
# - der Agent darf nur lesen und kommentieren, niemals Code ändern oder pushen
#
# Einrichtung: docs/setup/ci-und-agenten.md · Begründung: docs/decisions/0001-pr-review-agent.md

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

# Pro PR läuft nur ein Review; ein neuer Push bricht das alte ab.
concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

env:
  # Obergrenze für automatische Reviews pro Pull Request.
  MAX_AUTO_REVIEWS: 3
  # Unsichtbare Markierung, an der der Workflow seinen Zähler-Kommentar wiedererkennt.
  COUNTER_MARKER: <!-- claude-review-budget -->

jobs:
  review:
    # Fork-PRs sind ausgenommen: dort gibt es keinen Zugriff auf die Secrets.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '@claude review'))
    runs-on: ubuntu-latest
    steps:
      - name: Kontext bestimmen
        id: ctx
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "pr=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "manual=false" >> "$GITHUB_OUTPUT"
          else
            echo "pr=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
            echo "manual=true" >> "$GITHUB_OUTPUT"
          fi

      # Der Zähler lebt in einem PR-Kommentar statt in einer Datei: sichtbar für den
      # Repo-Owner und ohne Extra-Infrastruktur zurückzusetzen (Kommentar löschen).
      - name: Review-Budget prüfen
        id: budget
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.ctx.outputs.pr }}
        run: |
          set -euo pipefail
          counter=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments?per_page=100" --paginate \
            | jq -s --arg marker "$COUNTER_MARKER" \
                '[flatten[] | select(.body | contains($marker))] | first // {}')
          comment_id=$(jq -r '.id // ""' <<<"$counter")
          used=$(jq -r '.body // ""' <<<"$counter" | grep -oP '(?<=<!-- used: )[0-9]+' || echo 0)
          echo "comment_id=$comment_id" >> "$GITHUB_OUTPUT"
          echo "used=$used" >> "$GITHUB_OUTPUT"

          if [ "${{ steps.ctx.outputs.manual }}" = "true" ]; then
            echo "Manuell angefordert – Budget wird nicht angetastet."
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$used" -lt "$MAX_AUTO_REVIEWS" ]; then
            echo "Automatisches Review $((used + 1)) von $MAX_AUTO_REVIEWS."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Budget aufgebraucht ($used von $MAX_AUTO_REVIEWS). Weiteres Review nur per '@claude review'."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Repository auschecken
        if: steps.budget.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PR-Stand auschecken
        if: steps.budget.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr checkout "${{ steps.ctx.outputs.pr }}"

      # Kleine, ungefährliche Änderungen bekommen das günstige Modell, alles Größere
      # oder alles an sensiblen Stellen (Parser, Klassifizierung, Workflows) das starke.
      - name: Modell nach Umfang und Risiko wählen
        id: model
        if: steps.budget.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.ctx.outputs.pr }}
        run: |
          set -euo pipefail
          changed=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.additions + .deletions')
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')
          risky=false
          if grep -qE '^(frontend/src/lib/|frontend/src/workers/|\.github/workflows/)' <<<"$files"; then
            risky=true
          fi

          if [ "$changed" -le 150 ] && [ "$risky" = "false" ]; then
            model=haiku
          else
            model=sonnet
          fi
          echo "Geänderte Zeilen: $changed · sensible Pfade betroffen: $risky · Modell: $model"
          echo "model=$model" >> "$GITHUB_OUTPUT"

      - name: Review durchführen
        if: steps.budget.outputs.run == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ steps.ctx.outputs.pr }}

            Du bist der Review-Agent dieses Repositories. Der PR-Stand ist bereits
            ausgecheckt. Sprache aller Kommentare: Deutsch.

            Vorgehen:
            1. Lies `.claude/CLAUDE.md` – die dortigen Regeln sind der Maßstab.
            2. Hole den Diff mit `gh pr diff ${{ steps.ctx.outputs.pr }}` und lies ihn
               Zeile für Zeile. Öffne bei Bedarf die betroffenen Dateien für Kontext.
            3. Melde nur belegbare Probleme. Wenn du dir nicht sicher bist, ob etwas
               ein Fehler ist, schreib den Zweifel dazu statt es als Fehler zu behaupten.

            Priorität der Prüfpunkte:
            - Verstöße gegen die Architekturregeln aus `.claude/CLAUDE.md`: eigener
              Server/Backend, Fachdaten in localStorage/sessionStorage/Cookies,
              GAEB-Wissen außerhalb von `frontend/src/lib/gaeb/`, Fixture-Daten im UI.
            - Fehler in der Logik, falsch behandelte Grenzfälle, verschluckte Exceptions.
            - Sicherheitsprobleme.
            - Fehlende Tests: jede neue Exception und jeder neue Parserpfad braucht einen.
            - Performance bei sehr großen LVs (Richtung 10.000 Positionen).

            Nicht melden: Formatierung und Stil (macht ESLint + Prettier automatisch),
            Geschmacksfragen, Lob, Zusammenfassungen des Diffs.

            Ausgabe – ausschließlich als GitHub-Kommentare, nicht als Chat-Antwort:
            - Pro Fundstelle ein Inline-Kommentar mit
              `mcp__github_inline_comment__create_inline_comment` (`confirmed: true`),
              höchstens 10 insgesamt, wichtigste zuerst. Jeder Kommentar: Was ist das
              Problem, warum ist es eins, und ein konkreter Vorschlag.
            - Danach genau ein Gesamtkommentar über `gh pr comment`: 3–6 Stichpunkte in
              einfacher Sprache ohne Fachjargon, erste Zeile entweder
              "Keine Blocker gefunden." oder "Blocker: <ein Satz>".
            - Jeder Kommentar endet mit einer Leerzeile, dann `---`, dann
              `_Generated by [Claude Code](https://claude.ai/code)_`.

            Verboten: Code ändern, committen, pushen, Reviews genehmigen, PRs mergen.
          claude_args: |
            --model ${{ steps.model.outputs.model }}
            --max-turns 25
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"

      - name: Budget-Zähler aktualisieren
        if: steps.budget.outputs.run == 'true' && steps.ctx.outputs.manual == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.ctx.outputs.pr }}
          COMMENT_ID: ${{ steps.budget.outputs.comment_id }}
          USED: ${{ steps.budget.outputs.used }}
        run: |
          set -euo pipefail
          next=$((USED + 1))
          body=$(cat <<EOF
          $COUNTER_MARKER
          <!-- used: $next -->
          **Automatische Code-Reviews:** $next von $MAX_AUTO_REVIEWS verbraucht.

          - Weiteres Review anfordern: Kommentar mit \`@claude review\` schreiben (zählt nicht mit).
          - Zähler zurücksetzen: diesen Kommentar löschen.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_
          EOF
          )
          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" -f body="$body"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body"
          fi
